[package]
name = "api"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "api"
path = "src/main.rs"

[[bin]]
name = "build_index"
path = "src/bin/build_index.rs"

[dependencies]
axum = { version = "0.8.1", features = ["json"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
flate2 = "1.1.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
