services:
  nginx:
    image: nginx:1.27-alpine
    container_name: rinha-nginx
    depends_on:
      api1:
        condition: service_started
      api2:
        condition: service_started
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "10MB"
    networks:
      - rinha-net

  api1:
    image: joaomiraya/rinha-backend-2026:${IMAGE_TAG:-1.0.4}
    container_name: rinha-api-1
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "160MB"
    networks:
      - rinha-net

  api2:
    image: joaomiraya/rinha-backend-2026:${IMAGE_TAG:-1.0.4}
    container_name: rinha-api-2
    depends_on:
      api1:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "160MB"
    networks:
      - rinha-net

networks:
  rinha-net:
    driver: bridge
